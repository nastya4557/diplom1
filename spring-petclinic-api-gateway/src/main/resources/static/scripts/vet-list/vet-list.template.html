<div class="mb-4">
    <h2>📦 Products</h2>
    <p class="text-muted" style="max-width: 620px;">
        Browse available products in the microservices-based online store.
        All requests are distributed-traced with Zipkin.
    </p>
</div>

<div class="table-responsive">
    <table class="table table-hover table-striped">
        <thead>
            <tr>
                <th style="width: 12%;">Icon</th>
                <th style="width: 33%;">Product Name</th>
                <th style="width: 30%;">Category</th>
                <th style="width: 25%;">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="vet in $ctrl.vetList">
                <td style="font-size: 26px;">
                    <span ng-if="vet.firstName === 'Wireless'">🎧</span>
                    <span ng-if="vet.firstName === 'Smart'">⌚</span>
                    <span ng-if="vet.firstName === 'Gaming'">⌨️</span>
                    <span ng-if="vet.firstName === 'USB-C'">🔌</span>
                    <span ng-if="vet.firstName === 'Bluetooth'">🔊</span>
                    <span ng-if="vet.firstName === 'Laptop'">💻</span>
                    <span ng-if="vet.firstName !== 'Wireless' && vet.firstName !== 'Smart' && vet.firstName !== 'Gaming' && vet.firstName !== 'USB-C' && vet.firstName !== 'Bluetooth' && vet.firstName !== 'Laptop'">📦</span>
                </td>
                <td><strong>{{vet.firstName}} {{vet.lastName}}</strong></td>
                <td>
                    <span ng-repeat="specialty in vet.specialties" class="badge bg-secondary me-1">
                        {{specialty.name}}
                    </span>
                    <span ng-if="!vet.specialties.length" class="text-muted">—</span>
                </td>
                <td>
                    <span class="text-success fw-bold">
                        ${{(vet.id * 17 + 29) | number:2}}
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
