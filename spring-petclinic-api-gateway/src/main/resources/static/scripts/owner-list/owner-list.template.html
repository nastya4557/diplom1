<div class="mb-4">
    <h2>👥 Customers</h2>
    <p class="text-muted" style="max-width: 620px;">
        Customer accounts and their orders in the distributed online store.
        Data is loaded through microservices with full observability.
    </p>
</div>

<form onsubmit="javascript:void(0)" style="max-width: 22em; margin-bottom: 1.5em;">
    <div class="form-group">
        <input type="text" class="form-control" placeholder="🔍 Search customers..." ng-model="$ctrl.query" />
    </div>
</form>

<table class="table table-hover table-striped">
    <thead>
        <tr>
            <th style="width: 8%;"></th>
            <th>Name</th>
            <th class="hidden-sm hidden-xs">Address</th>
            <th>City</th>
            <th>Telephone</th>
            <th class="hidden-xs">Orders</th>
        </tr>
    </thead>
    <tr ng-repeat="owner in $ctrl.owners | filter:$ctrl.query track by owner.id">
        <td style="font-size: 22px;">👤</td>
        <td>
            <a ui-sref="ownerDetails({ ownerId: owner.id })">
                <strong>{{owner.firstName}} {{owner.lastName}}</strong>
            </a>
        </td>
        <td class="hidden-sm hidden-xs">{{owner.address}}</td>
        <td>{{owner.city}}</td>
        <td>{{owner.telephone}}</td>
        <td class="hidden-xs">
            <span ng-repeat="pet in owner.pets track by pet.id" class="badge bg-warning text-dark me-1">
                🧾 {{pet.name}}
            </span>
        </td>
    </tr>
</table>
